<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos — Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-box text-primary me-2"></i>Productos
        </h2>
        <a th:href="@{/productos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nuevo Producto
        </a>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>SKU</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p, iter : ${productos}">
                        <td th:text="${iter.count}"></td>
                        <td><code th:text="${p.sku}"></code></td>
                        <td class="fw-semibold" th:text="${p.nombre}"></td>
                        <td>
                                <span class="badge bg-secondary"
                                      th:text="${p.categoria != null ? p.categoria.nombre : '—'}"></span>
                        </td>
                        <td th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                        <td th:text="${p.cantidad}"></td>
                        <td>
                            <span th:if="${p.stockBajo}" class="badge bg-danger">Stock Bajo</span>
                            <span th:unless="${p.stockBajo}" class="badge bg-success">OK</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/productos/editar/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Editar">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/productos/eliminar/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Estás seguro de eliminar este producto?')"
                               title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${productos.isEmpty()}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            No hay productos registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
