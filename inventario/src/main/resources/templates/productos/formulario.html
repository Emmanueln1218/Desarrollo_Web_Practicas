<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-box text-primary me-2"></i>
                        <span th:text="${titulo}"></span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nombre del Producto *</label>
                                <input type="text" class="form-control" th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Código SKU *</label>
                                <input type="text" class="form-control" th:field="*{sku}"
                                       th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'"
                                       placeholder="Ej: PROD-001" required>
                                <div class="invalid-feedback" th:errors="*{sku}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Precio ($) *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control"
                                       th:field="*{precio}"
                                       th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{precio}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Cantidad *</label>
                                <input type="number" min="0" class="form-control" th:field="*{cantidad}"
                                       th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{cantidad}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Stock Mínimo</label>
                                <input type="number" min="0" class="form-control" th:field="*{stockMinimo}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Categoría</label>
                                <select class="form-select" th:field="*{categoria}">
                                    <option value="">-- Seleccionar --</option>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.id}"
                                            th:text="${cat.nombre}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/productos}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
